name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python Dependencies
        run: |
          # Here is the fix: We explicitly lock down the stable 2024 compiler!
          pip install "pip<24.1" setuptools "virtualenv==20.21.0"
          pip install "cython<3.0.0" buildozer "python-for-android==2024.1.21"

      - name: Build APK (Stable 2024 Compiler)
        run: |
          yes | buildozer android debug > build.log 2>&1 || BUILD_FAILED=1
          
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "================ ERROR LOG START ================"
            tail -n 50 build.log | grep -v "^#"
            echo "================= ERROR LOG END ================="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: bin/*.apk
