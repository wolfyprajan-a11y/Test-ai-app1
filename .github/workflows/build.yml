name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer & Fix Pyjnius Bug
        run: |
          python -m pip install "pip<24.1" setuptools "virtualenv==20.21.0"
          pip install "cython<3.0" buildozer "python-for-android==2024.1.21"

      - name: Check Buildozer
        run: |
          buildozer --version
          python --version
          java -version

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build_logs
          
          # Run buildozer and capture full output
          buildozer -v android debug > build_logs/build.log 2>&1 || BUILD_FAILED=1
          
          # Search everywhere for an APK file
          FOUND_APK=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -n "$FOUND_APK" ]; then
            echo "Found APK at: $FOUND_APK"
            mkdir -p bin
            cp "$FOUND_APK" bin/app-debug.apk
          else
            BUILD_FAILED=1
          fi

          if [ "$BUILD_FAILED" = "1" ]; then
            echo "## 🚨 Build Failed - Raw Log Tail" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build_logs/build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_logs/build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: bin/*.apk
          if-no-files-found: error
