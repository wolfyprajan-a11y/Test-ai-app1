name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer virtualenv

      - name: Build APK
        run: |
          # 1. Create spec file if missing
          buildozer init || true
          
          # 2. Configure compatible versions
          sed -i 's/.*android.api =.*/android.api = 33/' buildozer.spec
          sed -i 's/.*android.ndk =.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/.*android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          
          # 3. Save build output to a log file
          yes | buildozer android debug > build.log 2>&1 || BUILD_FAILED=1

          # 4. If it failed, print only the error lines clearly!
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "================ ERROR LOG START ================"
            grep -i -E "error|exception|failed" build.log | tail -n 30
            echo "================= ERROR LOG END ================="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: bin/*.apk
