name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Switched to 3.11 to match the buildozer.spec
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # Added -v2 to the keys to clear out the poisoned Python 3.14 cache
      - name: Cache Buildozer global directory
        uses: actions/cache@v3
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}-v2

      - name: Cache Buildozer local directory
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}-v2

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev ccache \
            libxslt1-dev libxml2-dev

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install "pip<24.1"
          pip install "Cython==0.29.36" virtualenv
          
          pip install git+https://github.com/kivy/python-for-android.git
          pip install git+https://github.com/kivy/buildozer.git

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Verify & Copy APK
        run: |
          mkdir -p bin_output
          FOUND_APK=$(find bin/ -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -z "$FOUND_APK" ]; then
            echo "🚨 BUILD FAILED: Buildozer did not produce an .apk file."
            ls -la bin/ || true
            exit 1
          fi
          
          echo "Found APK at: $FOUND_APK"
          cp "$FOUND_APK" bin_output/AI-Shell.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: bin_output/*.apk
          if-no-files-found: error
