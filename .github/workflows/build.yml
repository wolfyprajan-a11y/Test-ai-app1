name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer & Dependencies (With sh<2.0 Fix)
        run: |
          python -m pip install "pip<24.1" setuptools "virtualenv==20.21.0"
          # Lock sh below 2.0 to eliminate the python-for-android dependency conflict!
          pip install "sh<2.0" "cython<3.0" buildozer "python-for-android==2024.1.21"

      - name: Build APK
        run: |
          mkdir -p build_logs
          buildozer -v android debug 2>&1 | tee build_logs/build.log

      - name: Verify & Copy APK
        run: |
          mkdir -p bin_output
          FOUND_APK=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -z "$FOUND_APK" ]; then
            echo "🚨 BUILD FAILED: Buildozer did not produce an .apk file."
            exit 1
          fi
          
          echo "Found APK at: $FOUND_APK"
          cp "$FOUND_APK" bin_output/AI-Shell.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_logs/build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: bin_output/*.apk
          if-no-files-found: error
