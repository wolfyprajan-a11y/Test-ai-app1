name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # This is updated to v5 so the yellow warning goes away!
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python Dependencies
        run: |
          pip install "pip<24.1" setuptools "virtualenv==20.21.0"
          pip install "cython<3.0.0" buildozer

      - name: Build APK (with secret environment patch!)
        run: |
          # 1. Trigger Buildozer so it generates its hidden environment (it will crash, which is expected!)
          yes | buildozer android debug || true
          
          # 2. Hunt down the secret hidden pip file and patch the bug!
          VENV_PIP=$(find .buildozer -type f -name "pip" | grep "venv/bin/pip" | head -n 1)
          if [ -n "$VENV_PIP" ]; then
            echo "Found hidden pip at $VENV_PIP. Patching it now..."
            $VENV_PIP install "pip<24.1" "setuptools<70.0.0"
          fi
          
          # 3. Now that the bug is fixed, run the build for real!
          yes | buildozer android debug > build.log 2>&1 || BUILD_FAILED=1
          
          # 4. Error printing (just in case)
          if [ "$BUILD_FAILED" = "1" ]; then
            echo "================ ERROR LOG START ================"
            grep -i -E "error|exception|failed|traceback" build.log | tail -n 50
            echo "================= ERROR LOG END ================="
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: bin/*.apk
