name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer & Fix Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pip<24.1" "setuptools<70" "virtualenv==20.21.0"
          
          # Force sh to 1.14.3 to satisfy python-for-android
          pip install "sh==1.14.3" "cython<3.0" appdirs colorama jinja2 build toml packaging
          
          # Install python-for-android without allowing pip to touch sh
          pip install --no-deps "python-for-android==2024.1.21"
          pip install buildozer

      - name: Build APK
        run: |
          mkdir -p build_logs
          buildozer -v android debug 2>&1 | tee build_logs/build.log

      - name: Verify & Copy APK
        run: |
          mkdir -p bin_output
          
          echo "=== SEARCHING FOR GENERATED APK ==="
          # Search current working dir and buildozer home dir
          FOUND_APK=$(find . /home/runner/.buildozer -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -z "$FOUND_APK" ]; then
            echo "🚨 BUILD FAILED: Buildozer did not produce an .apk file."
            echo "Listing bin directory contents:"
            ls -la bin/ || true
            exit 1
          fi
          
          echo "Found APK at: $FOUND_APK"
          cp "$FOUND_APK" bin_output/AI-Shell.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_logs/build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: bin_output/*.apk
          if-no-files-found: error
