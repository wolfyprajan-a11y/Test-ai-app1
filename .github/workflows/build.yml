name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev ccache \
            libxslt1-dev libxml2-dev

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer virtualenv
          
          # Pin Cython strictly to 0.29.36 to ensure compatibility with Kivy 2.1.0
          pip install "sh==1.14.3" "Cython==0.29.36" appdirs colorama jinja2 build toml packaging
          pip install --no-deps "python-for-android==2024.1.21"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Verify & Copy APK
        run: |
          mkdir -p bin_output
          FOUND_APK=$(find bin/ -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -z "$FOUND_APK" ]; then
            echo "🚨 BUILD FAILED: Buildozer did not produce an .apk file."
            ls -la bin/ || true
            exit 1
          fi
          
          echo "Found APK at: $FOUND_APK"
          cp "$FOUND_APK" bin_output/AI-Shell.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: bin_output/*.apk
          if-no-files-found: error
