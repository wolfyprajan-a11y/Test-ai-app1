name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer & Fix Pyjnius Bug
        run: |
          python -m pip install "pip<24.1" setuptools "virtualenv==20.21.0"
          pip install "cython<3.0" buildozer "python-for-android==2024.1.21"

      - name: Check Buildozer
        run: |
          buildozer --version
          python --version
          java -version

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build_logs
          
          buildozer -v android debug 2>&1 | tee build_logs/build.log
          
          echo "================ LISTING BIN FOLDER ================"
          ls -la bin/ || true
          find bin/ -type f || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_logs/build.log
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: |
            bin/*.apk
            bin/**/*.apk
          if-no-files-found: error
