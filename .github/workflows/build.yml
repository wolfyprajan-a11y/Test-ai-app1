name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python Dependencies
        run: |
          pip install "pip<24.1" setuptools "virtualenv==20.21.0"
          pip install "cython<3.0.0" buildozer "python-for-android==2024.1.21"

      - name: Build APK
        run: |
          # Run buildozer and capture everything without the yes pipe (which caused the Broken pipe error!)
          buildozer android debug > build.log 2>&1 || true
          
          # Print the last 200 lines unfiltered just in case it's visible here
          echo "================ RAW LOG END ================"
          tail -n 200 build.log
          
          # Check if the APK was actually generated. If not, trigger the fail state!
          if ! ls bin/*.apk 1> /dev/null 2>&1; then
            echo "🚨 BUILD FAILED! Please download the build-log artifact to see why."
            exit 1
          fi

      - name: Upload Build Log (Always runs, even if it fails!)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Shell-App
          path: bin/*.apk
